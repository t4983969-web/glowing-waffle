<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f7f7">
<title>心语手机</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#1d1f24;color:#222;overflow:hidden}
#phone{position:fixed;inset:0;display:flex;flex-direction:column;background:#ededed}
@media(min-width:520px){
  body{display:flex;align-items:center;justify-content:center}
  #phone{position:relative;width:390px;height:820px;border-radius:36px;box-shadow:0 0 0 10px #111;overflow:hidden}
}
.status{height:26px;display:flex;justify-content:space-between;align-items:center;padding:0 18px;font-size:13px;background:#f7f7f7;flex:none}
.topbar{height:48px;display:grid;grid-template-columns:70px 1fr 70px;align-items:center;background:#f7f7f7;border-bottom:1px solid #ddd;padding:0 8px;flex:none}
.topbar .t{text-align:center;font-weight:600;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
#back{background:none;border:0;font-size:16px;color:#07c160;cursor:pointer;justify-self:start;padding:6px 0}
#right{justify-self:end}
.screen{flex:1;min-height:0;overflow-y:auto;background:#ededed}
.screen.chat{display:flex;flex-direction:column;overflow:hidden}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;padding:30px 16px;min-height:100%;background:linear-gradient(160deg,#cfe9ff,#ffd6e8)}
.app{text-align:center;font-size:12px;cursor:pointer}
.icon{position:relative;width:58px;height:58px;margin:0 auto 6px;border-radius:16px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.badge{position:absolute;top:-6px;right:-6px;background:#fa5151;color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;background:#fff;border-bottom:1px solid #eee}
.item .clickable{cursor:pointer}
.av{width:46px;height:46px;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:24px;overflow:hidden;flex:none;border:1px solid #eee}
.av img{width:100%;height:100%;object-fit:cover}
.av.wb{background:#fff7e0}
.meta{flex:1;min-width:0;cursor:pointer}
.name{font-size:15px;font-weight:500}
.tag{font-size:11px;color:#999;border:1px solid #ccc;border-radius:4px;padding:0 4px;margin-left:4px}
.prev{font-size:13px;color:#999;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}
.dot{background:#fa5151;color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px;text-align:center}
.chatlog{flex:1;overflow-y:auto;padding:12px}
.row{display:flex;align-items:flex-start;gap:8px;margin:8px 0}
.row.me{justify-content:flex-end}
.mini{width:36px;height:36px;flex:none;border-radius:6px;overflow:hidden;display:flex;align-items:center;justify-content:center;font-size:20px;background:#fff}
.mini img{width:100%;height:100%;object-fit:cover}
.bubble{max-width:72%;padding:9px 12px;border-radius:8px;background:#fff;font-size:15px;line-height:1.5;white-space:pre-wrap;word-break:break-word}
.row.me .bubble{background:#95ec69}
.bubble.dim{color:#999}
.tip{text-align:center;font-size:12px;color:#999;margin:10px 0}
.inputbar{display:flex;gap:8px;align-items:flex-end;padding:8px;background:#f7f7f7;border-top:1px solid #ddd;flex:none;padding-bottom:calc(8px + env(safe-area-inset-bottom))}
textarea,input,select{font:inherit;font-size:15px;padding:8px;border:1px solid #ccc;border-radius:6px;background:#fff;width:100%}
#inp{flex:1;resize:none;max-height:120px}
.send{background:#07c160;color:#fff;border:0;border-radius:6px;padding:9px 16px;font-size:15px;cursor:pointer;white-space:nowrap}
.send:disabled{opacity:.5}
.ghost{background:#fff;border:1px solid #ccc;border-radius:6px;padding:8px 12px;cursor:pointer;font-size:14px;white-space:nowrap}
.danger{background:#fa5151;color:#fff;border:0;border-radius:6px;padding:9px 14px;cursor:pointer;font-size:14px}
.form{padding:14px;display:flex;flex-direction:column;gap:12px}
.form label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:#555}
.form label.chk{flex-direction:row;align-items:center;gap:8px;color:#222}
.form input[type=checkbox]{width:auto}
.form h4{margin:10px 0 0;font-size:14px;color:#07c160}
.btns{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.avrow{display:flex;gap:8px;align-items:center}
.avrow .av{width:56px;height:56px;font-size:30px}
.avrow input{width:auto;flex:1}
.hint{font-size:12px;color:#888;padding:10px 14px;line-height:1.6}
.empty{text-align:center;color:#999;padding:60px 20px;font-size:14px}
</style>
</head>
<body>
<div id="phone">
  <div class="status"><span id="clock"></span><span>●●● 100%</span></div>
  <div class="topbar">
    <button id="back" onclick="back()">‹ 返回</button>
    <div class="t" id="title"></div>
    <div id="right"></div>
  </div>
  <div class="screen" id="screen"></div>
</div>
<script src="app.js"></script>
</body>
</html>
